name: Publish Python package

"on":
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c "import os; from msst._version import __version__; tag=os.environ['RELEASE_TAG'].removeprefix('v'); assert tag == __version__, f'tag {tag!r} != version {__version__!r}'"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Validate and smoke-test distributions
        run: |
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist/*.whl
          python -m pip install --no-deps --target "$RUNNER_TEMP/msst-wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/msst-wheel" python -c "import msst; from msst import Separator; print(msst.__version__)"
      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/msst
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
