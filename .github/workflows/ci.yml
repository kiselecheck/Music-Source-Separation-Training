name: Python package CI

"on":
  push:
    branches: [main, msst-package]
  pull_request:

permissions:
  contents: read

jobs:
  public-api:
    name: Public API (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"
      - name: Test public API, plugins, and keyed validation reports
        run: |
          python -m mypy
          python -m pytest tests/test_public_api.py tests/test_model_plugins.py tests/test_validation_manifest.py tests/test_validation_track_csv.py -q

  distribution:
    name: Build and inspect distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel from source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Validate metadata and wheel contents
        run: |
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist/*.whl
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python -m pip install --target "$RUNNER_TEMP/msst-wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/msst-wheel" python -c "import msst; from msst import Separator; print(msst.__version__)"
