[project]
name = "msst"
description = "Training and inference code for music source separation experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roman Solovyev (ZFTurbo)" }]
keywords = ["audio", "deep-learning", "music", "source-separation", "pytorch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML",
  "librosa",
  "matplotlib",
  "ml-collections",
  "numpy>=1.23",
  "omegaconf",
  "soundfile",
  "torch>=2.0.1,<2.12",
  "tqdm"
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/ZFTurbo/Music-Source-Separation-Training/tree/main/docs"
Homepage = "https://github.com/ZFTurbo/Music-Source-Separation-Training"
Issues = "https://github.com/ZFTurbo/Music-Source-Separation-Training/issues"
Repository = "https://github.com/ZFTurbo/Music-Source-Separation-Training"

[project.optional-dependencies]
accelerate = ["accelerate", "huggingface-hub>=0.23.0"]
gui = ["requests", "wxPython ; platform_python_implementation == 'CPython'"]
lora-loralib = ["loralib"]
lora-peft = ["peft"]
optimizer-8bit = ["bitsandbytes ; platform_system == 'Linux' and platform_machine == 'x86_64'"]
optimizer-muon = ["pytorch-optimizer"]
optimizer-prodigy = ["prodigyopt"]
scheduler = ["transformers"]
stream = ["keyboard", "pyaudio; python_version < '3.14'"]
train = [
  "audiomentations",
  "auraloss",
  "pedalboard",
  "torchaudio>=2.0.1,<2.12",
  "torch-l1-snr>=0.1.2",
  "torch-log-wmse>=0.3.1",
  "wandb"
]
test = ["pytest>=8"]
validation = ["auraloss", "torch-l1-snr>=0.1.2", "torch-log-wmse>=0.3.1"]
# models
apollo = ["pytorch-lightning"]
bandit = [
  "fire",
  "asteroid",
  "pedalboard",
  "pyloudnorm",
  "pytorch-lightning",
  "spafe",
  "torch-audiomentations",
  "torchaudio>=2.0.1,<2.12",
  "torchmetrics"
]
bandit_v2 = ["pytorch-lightning", "torchaudio>=2.0.1,<2.12"]
bs_conformer = ["beartype", "einops", "packaging", "rotary-embedding-torch"]
bs_mamba2 = [
  "packaging",
  "beartype",
  "einops",
  "mamba-ssm ; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "rotary-embedding-torch"
]
bs_roformer = [
  "beartype",
  "einops",
  "packaging",
  "rotary-embedding-torch",
  "PoPE-pytorch"
]
bs_roformer_experimental = [
  "packaging",
  "beartype",
  "einops",
  "hyper-connections",
  "rotary-embedding-torch"
]
conformer = ["conformer"]
experimental_mdx23c_stht = []
htdemucs = ["demucs", "einops", "openunmix"]
mdx23c = []
mel_band_conformer = [
  "beartype",
  "einops",
  "packaging",
  "rotary-embedding-torch"
]
mel_band_roformer = [
  "beartype",
  "einops",
  "packaging",
  "rotary-embedding-torch",
  "PoPE-pytorch"
]
mel_band_roformer_experimental = [
  "beartype",
  "einops",
  "packaging",
  "hyper-connections",
  "rotary-embedding-torch"
]
moises_light = ["moises-light"]
scnet = []
scnet_masked = []
scnet_tran = ["einops", "rotary-embedding-torch", "packaging"]
scnet_unofficial = [
  "beartype",
  "einops",
  "torchaudio>=2.0.1,<2.12"
]
segm_models = ["segmentation-models-pytorch", "timm"]
swin_upernet = ["transformers"]
torchseg = ["torchseg", "timm"]

[project.scripts]
msst-inference = "msst.cli:inference"
msst-train = "msst.cli:train"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "msst._version.__version__" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["msst*"]
namespaces = true

[tool.setuptools.package-data]
"msst.models.bandit.core.data.musdb" = ["validation.yaml"]
